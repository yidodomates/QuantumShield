name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Project Structure
        run: |
          mkdir -p app/src/main/java/com/quantum/shield
          mkdir -p app/src/main/assets
          
          if [ -f "MainActivity.java" ]; then cp MainActivity.java app/src/main/java/com/quantum/shield/; fi
          if [ -f "QuantumVpnService.java" ]; then cp QuantumVpnService.java app/src/main/java/com/quantum/shield/; fi
          if [ -f "index.html" ]; then cp index.html app/src/main/assets/; fi

          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.quantum.shield">\n    <application android:label="QuantumShield" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">\n        <activity android:name=".MainActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <service android:name=".QuantumVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true">\n            <intent-filter>\n                <action android:name="android.net.VpnService" />\n            </intent-filter>\n        </service>\n    </application>\n</manifest>' > app/src/main/AndroidManifest.xml

          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\ninclude \x27:app\x27\nrootProject.name=\x27QuantumShield\x27' > settings.gradle

          printf 'plugins { id \x27com.android.application\x27 }\nandroid {\n    namespace \x27com.quantum.shield\x27\n    compileSdk 34\n    defaultConfig {\n        applicationId \x27com.quantum.shield\x27\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName \x271.0\x27\n    }\n}' > app/build.gradle

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumShield-APK
          path: app/build/outputs/apk/debug/app-debug.apk
