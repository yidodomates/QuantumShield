name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/quantum/shield
          mkdir -p app/src/main/assets
          
          if [ -f "MainActivity.java" ]; then cp MainActivity.java app/src/main/java/com/quantum/shield/; fi
          if [ -f "QuantumVpnService.java" ]; then cp QuantumVpnService.java app/src/main/java/com/quantum/shield/; fi
          if [ -f "AndroidManifest.xml" ]; then mv AndroidManifest.xml app/src/main/; fi
          if [ -f "index.html" ]; then cp index.html app/src/main/assets/; fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          rootProject.name='QuantumShield'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.quantum.shield'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.quantum.shield'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumShield-APK
          path: app/build/outputs/apk/debug/app-debug.apk
